log_format velora '$remote_addr $request_method $uri $status $body_bytes_sent $request_time';

map "$status:$uri" $velora_cache_control {
    default "no-cache";
    ~^[0-9]+:/api/ "no-store";
    ~^(200|206|304):/assets/ "public, max-age=31536000, immutable";
    ~^(200|206|304):/images/ "public, max-age=604800";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log velora;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Cache-Control $velora_cache_control always;

    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Cache-Control;
        client_max_body_size 1m;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location /images/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
